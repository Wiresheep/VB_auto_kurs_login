plugins { id 'com.android.application' }
android {
    namespace 'de.wiresheep.kursplaner'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        // Keep the installed web versions' identity so promotion preserves their local data.
        applicationId 'de.wiresheep.kursplaner.webpreview'
        manifestPlaceholders = [appLabel: 'Kursfenster']
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '0.15.2'
    }
    buildTypes {
        release {
            // Reuse the existing local signing key to support updates of the web versions.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
