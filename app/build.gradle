plugins { id 'com.android.application' }
android {
    namespace 'de.wiresheep.kursplaner'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'de.wiresheep.kursplaner'
        if (project.hasProperty('webPreview')) applicationIdSuffix '.webpreview'
        manifestPlaceholders = [appLabel: project.hasProperty('webPreview') ? 'Kursfenster Webtest' : 'Kursfenster']
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '0.15.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
