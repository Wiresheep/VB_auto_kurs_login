name: iOS – Build für iPhone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Swift-Tests und iPhone-Build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Quellcode laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node.js 24

      - name: Xcode und iOS-SDK anzeigen
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Kern testen und Simulator-Build prüfen
        shell: bash
        run: ./ios/scripts/verify-on-mac.sh 2>&1 | tee "$RUNNER_TEMP/ios-check.log"

      - name: Helle und dunkle iPhone-Oberfläche aufnehmen
        shell: bash
        run: ./ios/scripts/capture-appearance.sh 2>&1 | tee "$RUNNER_TEMP/ios-appearance.log"

      - name: Unsignierten iPhone-Build erstellen
        shell: bash
        run: ./ios/scripts/build-unsigned-iphone.sh 2>&1 | tee "$RUNNER_TEMP/ios-device-build.log"

      - name: Unsignierte IPA und Prüfsumme bereitstellen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node.js 24
        with:
          name: Kursfenster-iPhone-UNSIGNIERT
          path: |
            ios/artifacts/Kursfenster-unsigned.ipa
            ios/artifacts/Kursfenster-unsigned.ipa.sha256
            ios/artifacts/INSTALLATION.txt
          if-no-files-found: error
          retention-days: 7

      - name: iPhone-Vorschauen bereitstellen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node.js 24
        with:
          name: Kursfenster-iPhone-Hell-Dunkel
          path: ios/artifacts/appearance/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Prüfprotokolle bereitstellen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node.js 24
        with:
          name: iOS-Buildprotokolle
          path: |
            ${{ runner.temp }}/ios-check.log
            ${{ runner.temp }}/ios-appearance.log
            ${{ runner.temp }}/ios-device-build.log
          if-no-files-found: ignore
          retention-days: 7
